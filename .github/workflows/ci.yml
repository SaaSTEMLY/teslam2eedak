name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Type Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun check

      - name: Lint
        run: bun lint

  test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: quality
    env:
      DATABASE_URL: file:./sqlite-data/ci.db
      PAYLOAD_SECRET: ci-test-secret-do-not-use-in-production-1234567890
      BETTER_AUTH_SECRET: ci-test-secret-do-not-use-in-production-1234567890
      NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_dummy
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy
      PAYLOAD_SCHEMA_PUSH: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create SQLite data directory
        run: mkdir -p sqlite-data

      - name: Start dev server
        run: |
          bun dev &
          echo "Waiting for server..."
          for i in $(seq 1 60); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ 2>/dev/null | grep -q "200"; then
              echo "Server ready after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Run integration tests
        run: bun run test
